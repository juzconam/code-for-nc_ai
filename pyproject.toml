[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "candidate-spread"
version = "1.0.0"
description = "Analysis code and derived records for candidate-spread uncertainty in physics-informed field reconstruction."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "<AUTHORS>"}
]
dependencies = [
  "numpy==2.0.2",
  "scipy>=1.10",
  "matplotlib==3.9.2",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "scikit-learn==1.6.1",
  "Pillow==11.1.0",
  "flowiz==0.0.10",
]

[project.optional-dependencies]
analysis = [
  "numpy==2.0.2",
  "scipy>=1.10",
  "matplotlib==3.9.2",
]
dev = [
  "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
